services:
  mvsim:
    build:
      context: .
      args:
        - USERNAME=${USER_NAME}
        - USER_UID=${USER_ID}
        - USER_GID=${USER_GID}
    image: mvsim
    container_name: mvsim_container
    runtime: nvidia
    network_mode: host
    stdin_open: true
    tty: true 

    # Variables de entorno
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    entrypoint: /bin/bash

    # Configuración de volúmenes
    volumes:
      - ./src:/sim_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix

    devices:
      - /dev/dri:/dev/dri

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]